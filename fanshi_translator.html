<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凡氏可行｜壞男話術翻譯機</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --black:#0a0a0a;--dark:#111;--card:#161616;--border:#2a2a2a;
  --gold:#c9a84c;--gold-dim:#8a6e2f;--red:#c0392b;
  --white:#e8e8e8;--muted:#555;
  --serif:'Noto Serif TC',serif;--mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;background:var(--black);color:var(--white);font-family:var(--serif);}

/* grain */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");pointer-events:none;z-index:0;}

.wrap{max-width:680px;margin:0 auto;padding:48px 20px 80px;position:relative;z-index:1;}

/* Header */
.header{text-align:center;margin-bottom:52px;}
.brand{font-family:var(--mono);font-size:9px;letter-spacing:.4em;color:var(--gold);margin-bottom:14px;text-transform:uppercase;}
.header h1{font-size:clamp(22px,5vw,32px);font-weight:700;line-height:1.25;margin-bottom:10px;}
.header h1 span{color:var(--gold);}
.header p{font-size:12px;color:var(--muted);line-height:1.9;max-width:420px;margin:0 auto;}

/* Divider */
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--border) 20%,var(--border) 80%,transparent);margin:0 0 40px;}

/* Input area */
.input-block{margin-bottom:12px;}
.input-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--gold);margin-bottom:10px;display:block;text-transform:uppercase;}
.input-wrap{position:relative;}
textarea{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:4px;padding:18px 20px;color:var(--white);
  font-family:var(--serif);font-size:14px;line-height:1.8;
  resize:none;outline:none;transition:border-color .2s;min-height:96px;
}
textarea:focus{border-color:var(--gold-dim);}
textarea::placeholder{color:#333;}
.char-count{font-family:var(--mono);font-size:9px;color:#333;text-align:right;margin-top:6px;}

/* Examples */
.examples{margin-bottom:28px;}
.ex-label{font-family:var(--mono);font-size:9px;color:#333;letter-spacing:.1em;margin-bottom:8px;}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 12px;background:transparent;border:1px solid #222;border-radius:2px;font-size:11px;color:#444;cursor:pointer;transition:all .2s;font-family:var(--serif);}
.chip:hover{border-color:var(--gold-dim);color:var(--gold);}

/* Translate btn */
.translate-btn{
  width:100%;padding:16px;background:var(--gold);color:var(--black);
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.15em;
  border:none;border-radius:3px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.translate-btn:hover{background:#deba5a;}
.translate-btn:disabled{background:#1e1e1e;color:#333;cursor:not-allowed;}
.translate-btn .spinner{width:14px;height:14px;border:2px solid #000;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.translate-btn.loading .spinner{display:block;}
.translate-btn.loading .btn-text{opacity:.6;}

/* Result */
.result-wrap{margin-top:32px;display:none;}
.result-wrap.show{display:block;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.result-card{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;position:relative;}
.result-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);}

.result-header{padding:16px 20px 14px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.result-tag{font-family:var(--mono);font-size:9px;letter-spacing:.25em;color:var(--gold);}
.result-score{font-family:var(--mono);font-size:9px;color:var(--muted);}

.result-body{padding:20px 20px 20px 24px;}
.original{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.7;padding:10px 14px;background:var(--dark);border-radius:3px;border-left:2px solid #2a2a2a;}
.original::before{content:'他說：';font-family:var(--mono);font-size:9px;color:#333;display:block;margin-bottom:6px;letter-spacing:.1em;}

.translation{margin-bottom:20px;}
.translation-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--gold);margin-bottom:10px;}
.translation-text{font-size:15px;font-weight:600;line-height:1.8;color:var(--white);}

.breakdown{border-top:1px solid var(--border);padding-top:16px;}
.breakdown-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);margin-bottom:10px;}
.breakdown-text{font-size:12px;color:#888;line-height:1.9;}

.verdict-bar{margin-top:16px;padding:12px 14px;background:var(--dark);border-radius:3px;}
.verdict-label{font-family:var(--mono);font-size:9px;color:var(--gold);margin-bottom:6px;letter-spacing:.15em;}
.verdict-text{font-size:12px;color:#c0392b;font-weight:600;line-height:1.6;}

/* Action row */
.action-row{display:flex;gap:8px;margin-top:16px;padding:0 24px 20px;}
.action-btn{flex:1;padding:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;border-radius:2px;cursor:pointer;transition:all .2s;border:none;background:transparent;}
.btn-share{border:1px solid var(--border);color:var(--muted);}
.btn-share:hover{border-color:var(--gold);color:var(--gold);}
.btn-again{border:1px solid var(--gold);color:var(--gold);}
.btn-again:hover{background:var(--gold);color:var(--black);}

/* History */
.history-wrap{margin-top:48px;}
.history-label{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:#2a2a2a;margin-bottom:16px;text-align:center;}
.history-list{display:flex;flex-direction:column;gap:10px;}
.history-item{background:var(--dark);border:1px solid #1a1a1a;border-radius:3px;padding:14px 16px;cursor:pointer;transition:all .2s;}
.history-item:hover{border-color:var(--border);}
.hi-original{font-size:11px;color:#333;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hi-translation{font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;border:1px solid var(--border);padding:10px 20px;border-radius:2px;font-family:var(--mono);font-size:10px;color:var(--gold);opacity:0;transition:all .3s;z-index:999;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Hidden share card */
#shareCard{position:fixed;top:0;left:-9999px;width:640px;background:#0a0a0a;font-family:'Noto Serif TC',serif;z-index:-1;}
.sc-wrap{width:640px;background:#0a0a0a;padding:0;}
.sc-header{background:#14110a;padding:20px 32px 18px;border-bottom:2px solid #c9a84c;display:flex;justify-content:space-between;align-items:center;}
.sc-brand{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.3em;color:#c9a84c;}
.sc-title{font-family:'Space Mono',monospace;font-size:8px;color:#555;letter-spacing:.1em;}
.sc-body{padding:28px 32px;}
.sc-original{font-size:11px;color:#444;margin-bottom:6px;font-family:'Space Mono',monospace;letter-spacing:.05em;}
.sc-said{font-size:14px;color:#666;margin-bottom:24px;line-height:1.7;padding:12px 16px;background:#111;border-left:2px solid #2a2a2a;border-radius:2px;}
.sc-tl-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.25em;color:#c9a84c;margin-bottom:10px;}
.sc-tl-text{font-size:18px;font-weight:700;color:#e8e8e8;line-height:1.7;margin-bottom:24px;}
.sc-bd-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.2em;color:#555;margin-bottom:8px;}
.sc-bd-text{font-size:12px;color:#666;line-height:1.9;margin-bottom:20px;}
.sc-verdict{background:#111;border:1px solid #1e1e1e;border-left:3px solid #c0392b;border-radius:3px;padding:12px 16px;}
.sc-vl{font-family:'Space Mono',monospace;font-size:8px;color:#c9a84c;margin-bottom:6px;letter-spacing:.15em;}
.sc-vt{font-size:12px;color:#c0392b;font-weight:600;line-height:1.6;}
.sc-footer{padding:14px 32px;border-top:1px solid #1a1800;display:flex;justify-content:space-between;}
.sc-fl{font-family:'Space Mono',monospace;font-size:7px;color:#2a2a2a;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">凡氏可行｜壞男免疫系統</div>
    <h1>壞男<span>話術</span>翻譯機</h1>
    <p>他說的和他的意思，從來不是同一件事<br>把他說過的話貼進來，我們幫你翻譯成白話</p>
  </div>

  <div class="rule"></div>

  <div class="input-block">
    <label class="input-label">他說了什麼</label>
    <div class="input-wrap">
      <textarea id="inputText" placeholder="例如：「我最近狀態不好，需要一點空間」" maxlength="300" rows="3" oninput="updateCount()"></textarea>
    </div>
    <div class="char-count"><span id="charCount">0</span> / 300</div>
  </div>

  <div class="examples">
    <div class="ex-label">常見話術快選</div>
    <div class="ex-chips">
      <div class="chip" onclick="fillExample('我最近太忙了')">我最近太忙了</div>
      <div class="chip" onclick="fillExample('我們順其自然就好')">我們順其自然就好</div>
      <div class="chip" onclick="fillExample('我現在不想被關係綁住')">我現在不想被關係綁住</div>
      <div class="chip" onclick="fillExample('妳想太多了')">妳想太多了</div>
      <div class="chip" onclick="fillExample('我受過傷，需要時間')">我受過傷，需要時間</div>
      <div class="chip" onclick="fillExample('妳對我來說很重要')">妳對我來說很重要</div>
      <div class="chip" onclick="fillExample('我不想破壞我們的感情')">我不想破壞我們的感情</div>
      <div class="chip" onclick="fillExample('我喜歡妳，但時機不對')">我喜歡妳，但時機不對</div>
    </div>
  </div>

  <button class="translate-btn" id="translateBtn" onclick="runTranslate()">
    <div class="spinner"></div>
    <span class="btn-text">翻譯他說的話</span>
  </button>

  <div class="result-wrap" id="resultWrap">
    <div class="result-card" id="resultCard">
      <div class="result-header">
        <div class="result-tag">話術翻譯結果</div>
        <div class="result-score" id="resultScore"></div>
      </div>
      <div class="result-body">
        <div class="original" id="resultOriginal"></div>
        <div class="translation">
          <div class="translation-label">他真正的意思是</div>
          <div class="translation-text" id="resultTranslation"></div>
        </div>
        <div class="breakdown">
          <div class="breakdown-label">解剖分析</div>
          <div class="breakdown-text" id="resultBreakdown"></div>
        </div>
        <div class="verdict-bar">
          <div class="verdict-label">凡氏判決</div>
          <div class="verdict-text" id="resultVerdict"></div>
        </div>
      </div>
      <div class="action-row">
        <button class="action-btn btn-share" onclick="shareResult()">截圖分享</button>
        <button class="action-btn btn-again" onclick="resetForm()">再翻一句</button>
      </div>
    </div>
  </div>

  <div class="history-wrap" id="historyWrap" style="display:none">
    <div class="history-label">本次翻譯紀錄</div>
    <div class="history-list" id="historyList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>
<div id="shareCard"></div>

<script>
let history=[];
let currentResult=null;

function updateCount(){
  const v=document.getElementById('inputText').value;
  document.getElementById('charCount').textContent=v.length;
}

function fillExample(text){
  document.getElementById('inputText').value=text;
  updateCount();
  document.getElementById('inputText').focus();
}

function resetForm(){
  document.getElementById('inputText').value='';
  document.getElementById('charCount').textContent='0';
  document.getElementById('resultWrap').classList.remove('show');
  setTimeout(()=>{document.getElementById('resultWrap').style.display='none';},400);
  document.getElementById('inputText').focus();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

async function runTranslate(){
  const input=document.getElementById('inputText').value.trim();
  if(!input){showToast('先把他說的話貼進來');return;}

  const btn=document.getElementById('translateBtn');
  btn.disabled=true;btn.classList.add('loading');
  btn.querySelector('.btn-text').textContent='翻譯中';

  try{
    const response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:`你是凡氏可行本人。地下關係裡的狠毒清醒派，不是戀愛諮商，不是雞湯，不是陪聊。你的工作是把男的那些屁話翻成白話，讓她看清楚自己在哪裡。

你的任務：把男的在曖昧、地下關係、無名分、前任拉扯、對方有伴侶還找她、砲友暈船裡說過的話，直接翻譯成他真正的意思。

口吻風格：
- 狠、直白、尖銳、黑色幽默、羞辱式警醒
- 像在深夜 Telegram 把一個暈船的人罵醒
- 可以帶髒話（幹、靠、屁）、性暗示，但要有洞察，不要為髒而髒
- 句子要短，像限動、Telegram 文案
- 不要鋪陳，開頭就戳

絕對不能做的事：
- 不要幫他合理化，不要說「他可能有苦衷」
- 不要說「妳值得更好的」這種溫柔廢話
- 不要講大道理，不要用心理學名詞
- 不要文青

核心視角：
妳不是被愛，是被使用
妳不是遇到海王，是妳太好拿捏
他不是太忙，是妳太好用
他不是不懂承諾，是他知道妳不用承諾也會留下
妳不是特別，妳是方便
妳不是放不下他，是戒不掉那一點被選中的感覺

每個輸出結尾都要讓人覺得：靠，這不就是我

句子結尾不要標點符號，不要破折號

你必須用以下 JSON 格式回應，只回 JSON，不要有任何前言或後語：
{
  "translation": "他真正的意思（一到三句，短、狠、直接，像限動文案）",
  "breakdown": "解剖分析（三到五句短句，拆他的操作邏輯，可以嘲他，讓她覺得靠這不就是我）",
  "verdict": "凡氏判決（一句話，最刺的結論，可以髒，要讓人想截圖）",
  "danger_level": "低威脅/中等威脅/高威脅/極高威脅"
}`,
        messages:[{role:'user',content:`請翻譯這句話：「${input}」`}]
      })
    });

    const data=await response.json();
    const raw=data.content[0].text.trim();
    let parsed;
    try{
      parsed=JSON.parse(raw);
    }catch{
      const match=raw.match(/\{[\s\S]*\}/);
      parsed=match?JSON.parse(match[0]):null;
    }

    if(!parsed)throw new Error('parse error');

    currentResult={input,parsed};
    history.unshift({input,parsed});

    // Render result
    document.getElementById('resultOriginal').textContent=input;
    document.getElementById('resultTranslation').textContent=parsed.translation;
    document.getElementById('resultBreakdown').textContent=parsed.breakdown;
    document.getElementById('resultVerdict').textContent=parsed.verdict;

    const scoreColors={
      '低威脅':'#4caf7d',
      '中等威脅':'#c9a84c',
      '高威脅':'#c97c2b',
      '極高威脅':'#c0392b'
    };
    const sc=document.getElementById('resultScore');
    sc.textContent=parsed.danger_level||'';
    sc.style.color=scoreColors[parsed.danger_level]||'var(--muted)';

    const rw=document.getElementById('resultWrap');
    rw.style.display='block';
    requestAnimationFrame(()=>rw.classList.add('show'));
    rw.scrollIntoView({behavior:'smooth',block:'start'});

    renderHistory();

  }catch(e){
    console.error(e);
    showToast('翻譯失敗，請重試');
  }

  btn.disabled=false;btn.classList.remove('loading');
  btn.querySelector('.btn-text').textContent='翻譯他說的話';
}

function renderHistory(){
  if(history.length<=1){document.getElementById('historyWrap').style.display='none';return;}
  document.getElementById('historyWrap').style.display='block';
  const list=document.getElementById('historyList');
  list.innerHTML=history.slice(1).map((h,i)=>`
    <div class="history-item" onclick="loadHistory(${i+1})">
      <div class="hi-original">「${h.input}」</div>
      <div class="hi-translation">${h.parsed.translation}</div>
    </div>`).join('');
}

function loadHistory(idx){
  const h=history[idx];
  document.getElementById('inputText').value=h.input;
  updateCount();
  currentResult={input:h.input,parsed:h.parsed};
  document.getElementById('resultOriginal').textContent=h.input;
  document.getElementById('resultTranslation').textContent=h.parsed.translation;
  document.getElementById('resultBreakdown').textContent=h.parsed.breakdown;
  document.getElementById('resultVerdict').textContent=h.parsed.verdict;
  const scoreColors={'低威脅':'#4caf7d','中等威脅':'#c9a84c','高威脅':'#c97c2b','極高威脅':'#c0392b'};
  const sc=document.getElementById('resultScore');
  sc.textContent=h.parsed.danger_level||'';
  sc.style.color=scoreColors[h.parsed.danger_level]||'var(--muted)';
  const rw=document.getElementById('resultWrap');
  rw.style.display='block';rw.classList.add('show');
  rw.scrollIntoView({behavior:'smooth',block:'start'});
}

async function shareResult(){
  if(!currentResult){return;}
  const {input,parsed}=currentResult;
  const today=new Date();
  const ds=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const scoreColors={'低威脅':'#4caf7d','中等威脅':'#c9a84c','高威脅':'#c97c2b','極高威脅':'#c0392b'};
  const vc=scoreColors[parsed.danger_level]||'#c0392b';

  const sc=document.getElementById('shareCard');
  sc.innerHTML=`<div class="sc-wrap">
    <div class="sc-header">
      <div class="sc-brand">凡氏可行 · 壞男話術翻譯機</div>
      <div class="sc-title">AUTOPSY · ${ds}</div>
    </div>
    <div class="sc-body">
      <div class="sc-original">他說</div>
      <div class="sc-said">「${input}」</div>
      <div class="sc-tl-label">他真正的意思是</div>
      <div class="sc-tl-text">${parsed.translation}</div>
      <div class="sc-bd-label">解剖分析</div>
      <div class="sc-bd-text">${parsed.breakdown}</div>
      <div class="sc-verdict">
        <div class="sc-vl">凡氏判決 · ${parsed.danger_level}</div>
        <div class="sc-vt" style="color:${vc}">${parsed.verdict}</div>
      </div>
    </div>
    <div class="sc-footer">
      <span class="sc-fl">凡氏可行 / 壞男免疫系統</span>
      <span class="sc-fl">fanshikexing.com</span>
    </div>
  </div>`;

  showToast('正在生成截圖');
  await document.fonts.ready;
  await new Promise(r=>setTimeout(r,600));

  try{
    const canvas=await html2canvas(sc.querySelector('.sc-wrap'),{
      scale:2,useCORS:true,backgroundColor:'#0a0a0a',logging:false,width:640
    });
    const link=document.createElement('a');
    const today2=new Date();
    const ds2=`${today2.getFullYear()}${String(today2.getMonth()+1).padStart(2,'0')}${String(today2.getDate()).padStart(2,'0')}`;
    link.download=`凡氏話術翻譯_${ds2}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    showToast('截圖已下載');
  }catch(e){
    showToast('截圖失敗，請重試');
  }
  sc.innerHTML='';
}
</script>
</body>
</html>
